[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/wg-core",
    "crates/net-linux",
    "crates/control-plane",
    "crates/control-client",
    "crates/relay",
    "crates/obfs",
    "crates/daita",
    "crates/seccomp",
    "crates/attest",
    "crates/pq",
    "crates/mimicry",
    "crates/client-core",
    "crates/oxide-agentd",
    "crates/oxide-serverd",
    "crates/oxide-client",
    "crates/oxide-tui",
    "crates/oxide-admin-tui",
]

# Shared dependency versions. Members opt in via `dep.workspace = true`.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
boringtun = "0.7"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
blake2 = "0.10"
ipnet = { version = "2", features = ["serde"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["timeout"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

# Thin release profile appropriate for a packet-forwarding daemon.
[profile.release]
opt-level = 3
lto = "thin"
