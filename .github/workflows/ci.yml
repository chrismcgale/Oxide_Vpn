name: CI

on:
  push:
    branches: [main, rearchitect-wireguard]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt • clippy • test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  audit:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  netns:
    name: live tunnel (network namespaces, root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install networking tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 iputils-ping
      - name: Build daemons
        run: cargo build -p oxide-serverd -p oxide-client
      - name: Run end-to-end tunnel test as root
        run: sudo -E env "PATH=$PATH" OXIDE_SKIP_BUILD=1 bash scripts/netns-test.sh
