[package]
name = "oxide-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oxide-tui"
path = "src/main.rs"

[dependencies]
oxide-common = { path = "../common" }
oxide-control-client = { path = "../control-client" }
oxide-client-core = { path = "../client-core" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
