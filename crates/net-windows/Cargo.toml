[package]
name = "oxide-net-windows"
version = "0.1.0"
edition = "2021"

[lib]
name = "oxide_net_windows"
path = "src/lib.rs"

# The whole crate is `#![cfg(target_os = "windows")]`, so on other targets it builds empty and
# these deps are only pulled for a Windows build. All are cross-platform crates.
[dependencies]
oxide-common = { path = "../common" }
tokio = { workspace = true }
ipnet = { workspace = true }
socket2 = "0.5"
